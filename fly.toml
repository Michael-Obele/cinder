# fly.toml app configuration file generated for cinder9630 on 2026-08-10T19:50:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cinder9630'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  GIN_MODE = 'release'
  LOG_LEVEL = 'info'
  SERVER_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[http_service.checks]

  [http_service.checks.health]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  memory = '512mb'
  processes = ['app']
  size = 'shared-cpu-1x'
