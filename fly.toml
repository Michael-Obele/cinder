# fly.toml app configuration file generated for cinder9630 on 2026-07-18T16:04:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cinder9630'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  GIN_MODE = 'release'
  LOG_LEVEL = 'info'
  SERVER_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
